# Publishes enemy_item_scaling.sdkmod as a GitHub Release whenever a v* tag is pushed.
#
# To cut a release:
#   1. Bump `version` in src/enemy_item_scaling/pyproject.toml and add a changelog entry to
#      src/enemy_item_scaling/Readme.md.
#   2. git tag v<version> && git push origin v<version>

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check that the tag matches the mod version
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("src/enemy_item_scaling/pyproject.toml", "rb"))["project"]["version"])')"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match version ${version} in src/enemy_item_scaling/pyproject.toml" >&2
            exit 1
          fi

      - name: Build the .sdkmod
        # A .sdkmod is a zip whose only top-level folder is named like the file.
        run: cd src && zip -r ../enemy_item_scaling.sdkmod enemy_item_scaling -x '*__pycache__*'

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" enemy_item_scaling.sdkmod
          --title "Enemy and Item Scaling $GITHUB_REF_NAME"
          --generate-notes
