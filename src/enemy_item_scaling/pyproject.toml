[project]
name = "enemy_item_scaling"
version = "0.7"
authors = [{ name = "CalebEaston" }]
description = """\
Keeps enemy and item levels within a band around your level, so areas you come back to and the \
loot they drop stay relevant.

Each bound is its own setting: raise under-levelled enemies, raise under-levelled loot, cap \
over-levelled enemies, cap over-levelled loot, or leave any of them vanilla.
"""

[project.urls]
Changelog = "https://github.com/CalebEaston/bl2-enemy-and-item-scaling-sdk/blob/main/src/enemy_item_scaling/Readme.md"

[tool.sdkmod]
name = "Enemy and Item Scaling"
download = "https://github.com/CalebEaston/bl2-enemy-and-item-scaling-sdk/releases/latest"
supported_games = ["BL2", "TPS"]
coop_support = "HostOnly"
